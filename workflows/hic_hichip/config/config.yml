# BioFlowAI Hi-C / HiChIP example configuration.
# Copy this file to config/config.yml and edit paths before running real data.

workdir: "."
outdir: "results"
raw_data_dir: "raw_data"
samples: "config/samples.example.tsv"
comparisons: "config/comparisons.example.tsv"
validate_input_files: false

assay: "hichip"

genome:
  assembly: "hg38"
  fasta: "/path/to/hg38.fa"
  chrom_sizes: "/path/to/hg38.chrom.sizes"
  bowtie2_index: "/path/to/bowtie2/hg38"
  restriction_fragments: "/path/to/hg38_MboI_resfrag.bed"
  blacklist: ""

preprocessing:
  enable_fastp: false
  fastp_extra: "--detect_adapter_for_pe"

hicpro:
  container: "/home/mowp/software/HiC-Pro/hicpro3.sif"
  config_template: "config/hicpro.config.template"
  resolutions: [5000, 10000, 25000, 50000, 100000, 250000, 500000, 1000000]
  ligation_site: "GATCGATC"
  restriction_enzyme: "MboI"
  min_mapq: 30
  remove_duplicates: true
  ice_norm: true
  singularity_args: ""
  extra_bind_paths: []
  extra: ""
  allow_multiple_hicpro_candidates: false

matrix:
  balance: true

peak_calling:
  enable_auto_peak: true
  caller: "macs2"          # macs2 or macs3
  genome_size: "hs"
  qvalue: 0.01
  mode: "BAMPE"
  extra: ""
  use_hicpro_bam: true
  allow_empty: false

loop_calling:
  enable: true
  # hichip: fithichip is preferred when FitHiChIP is installed.
  # hic: mustache or cooltools are usually easier than GPU-dependent HiCCUPS.
  caller: "fithichip"
  resolution: 10000
  fdr: 0.01
  min_dist: 20000
  max_dist: 2000000
  peak_mode: "external_peak"
  external_peaks: ""
  fithichip_script: "FitHiChIP_HiCPro.sh"
  mustache_bin: "mustache"
  cooltools_bin: "cooltools"
  allow_empty: true

qc:
  enable_multiqc: true
  enable_distance_decay: true
  enable_cis_trans: true
  enable_correlation: true

annotation:
  enable: false
  promoters: ""
  enhancers: ""
  gtf: ""
  promoter_upstream: 2000
  promoter_downstream: 2000

diffloop:
  enable: true
  method: "deseq2"
  quantification_source: "cool"   # cool or validpairs
  use_balanced_counts: false
  loop_universe: "union"          # union, intersection, group_consensus
  anchor_slop: 0
  group_consensus_min_replicates: 1
  group_consensus_min_fraction: 0.5
  min_count: 10
  fdr: 0.05
  lfc_cutoff: 0.0
  design_formula: "~ group"
  paired: false
  batch_column: ""
  patient_column: ""

threads:
  fastp: 8
  hicpro: 32
  matrix_convert: 4
  peak_calling: 4
  loop_calling: 16
  diffloop: 8
