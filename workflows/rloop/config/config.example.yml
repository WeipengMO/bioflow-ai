# BioFlowAI R-loop profiling workflow configuration.
# Copy this file to config/config.yml before running.

assay: DRIP-seq
mode: pe  # pe or se
outdir: results

sample_config: config/samples.yml
raw_data_dir: raw_data

# Optional explicit FASTQ manifest. Leave empty to auto-discover FASTQs from raw_data_dir.
fastq_manifest: ""

# Reference files. Keep all genome resources on the same assembly.
genome: /path/to/bowtie2/index/prefix
gsize: hs  # Genome size for MACS3. Can be a number (e.g. 2.7e9) or a predefined code (hs, mm, etc.)
blacklist: /path/to/ENCODE_blacklist.bed

# Chromosome names removed before duplicate marking. Set [] to disable mitochondrial filtering.
mitochondrial_chromosomes:
  - chrM
  - MT

# Software dependency paths
picard_path: picard

# Core switches
peak_type: broad  # broad or narrow; broad is recommended for DRIP-seq domains.
enable_rnaseh_subtraction: true
# Signal tracks keep duplicate-marked fragments for browser visualization.
signal_duplicate_mode: keep_marked
# Peak calling: auto (default) uses markdup BAM with --keep-dup all.
# CUT&Tag/CUT&RUN PCR duplicates enrich signal regions; removing them biases toward background.
# Only set to remove if duplication rate is extremely high (80-90%+, near sequencing saturation).
peak_duplicate_mode: auto  # auto | keep_marked | remove
dup_threshold_for_dedup: 0.90  # Warn when Picard PERCENT_DUPLICATION >= this threshold (auto mode).
write_deprecated_rnaseh_sensitive_alias: false
enable_insert_size_qc: true
enable_multiqc: true

# Tool-specific extra arguments
fastp_extra: ""
fastp_pe_extra: "--detect_adapter_for_pe"
fastp_se_extra: ""
bowtie2_extra: "--very-sensitive"
mark_duplicates_extra: ""
alignment_filter_min_mapq: 30
alignment_filter_view_extra: ""  # auto: PE uses -F 3852, SE uses -F 3844
bam_coverage_extra: "--binSize 10 --normalizeUsing CPM --skipNonCoveredRegions"

# Common-scale bigWigs preserve global signal differences such as RNaseH depletion.
# CPM tracks above remain useful for local browser shape comparisons but should not be
# used to infer global RNaseH loss. By default, scale factors are computed from this
# run's duplicate-marked signal BAM effective fragments: scale_factor = 1e6 / fragments.
enable_common_scale_bigwig: false
common_scale_normalization: None  # None/raw uses --normalizeUsing None; RPGC also requires effective_genome_size or numeric gsize.
signal_scale_factor_method: effective_fragments  # effective_fragments, raw, tsv, or spikein.
signal_scale_factors_tsv: ""  # Used only when signal_scale_factor_method: tsv; columns: sample, scale_factor.
# Spike-in normalization (e.g., E. coli K-12 MG1655).
# When signal_scale_factor_method: spikein, reads are aligned to the spike-in genome and
# scale factors are computed from spike-in alignment counts to preserve real signal differences.
# Run scripts/build_spikein_index.sh to download E. coli and build a Bowtie2 index.
# spikein_genome: data/spikein/ecoli_mg1655  # Bowtie2 index prefix for the spike-in genome.
# spikein_method: ratio  # ratio (reference sample ratio) or rpm (reads per million spike-in reads).
# spikein_reference_sample: WT_DRIP_rep1  # Required for ratio mode; this sample gets scale_factor=1.0.
common_scale_bam_coverage_extra: "--binSize 10"
enable_bigwig_debug_tracks: false
debug_raw_bam_coverage_extra: "--binSize 10 --normalizeUsing None"
rnaseh_signal_min_fold_change: 2.0
rnaseh_signal_min_treatment_signal: 0.0

# MACS3 defaults are chosen from peak_type and mode.
# broad:  --broad --broad-cutoff 0.1 --keep-dup all -q 0.05
# narrow: --keep-dup all -q 0.01
macs3_extra: ""

# Union-style replicate consensus peaks.
consensus_min_support: 2

# Optional report customization
insert_size_extra: ""
multiqc_extra: ""

# Per-rule threads
threads:
  fastp: 8
  bowtie2: 24
  alignment_filter: 4
  mark_duplicates: 4
  remove_duplicates: 4
  blacklist_filter: 4
  bam_coverage: 8
  bam_coverage_common_scale: 8
  bam_coverage_debug: 8
  scale_factors: 2
  bigwig_header_qc: 1
  macs3: 1
  rnaseh_subtract: 2
  rnaseh_signal: 2
  replicate_consensus: 2
  insert_size: 2
  frip: 4
  multiqc: 2
