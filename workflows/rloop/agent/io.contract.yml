version: 1

inputs:
  config/config.yml:
    owner: user
    required: true
    description: Project-specific R-loop workflow configuration.
  config/samples.yml:
    owner: user
    required: true
    description: Sample metadata keyed by sample name, including treatment/control/RNase H roles.
  config/fastq_manifest.tsv:
    owner: user
    required: false
    description: Explicit FASTQ mapping for irregular names or unmerged lanes.
  raw_data/:
    owner: user
    required: true
    description: FASTQ directory used when fastq_manifest is not set.

external_references:
  bowtie2_index:
    config_key: genome
    required: true
  genome_size:
    config_key: gsize
    required: true
  blacklist_bed:
    config_key: blacklist
    required: false
  spikein_bowtie2_index:
    config_key: spikein_genome
    required: false
    note: Bowtie2 index for the spike-in genome; required when signal_scale_factor_method is spikein.

generated:
  results/clean_data/:
    safe_to_delete: true
  results/aligned_data/:
    safe_to_delete: true
  results/bigwig/:
    safe_to_delete: true
  results/bigwig_common_scale/:
    safe_to_delete: true
  results/macs3_results/:
    safe_to_delete: true
  results/rnaseh_no_overlap/:
    safe_to_delete: true
  results/rnaseh_signal/:
    safe_to_delete: true
  results/rnaseh_filtered/:
    safe_to_delete: true
    note: Deprecated compatibility alias for rnaseh_no_overlap; not proof of quantitative RNaseH sensitivity.
  results/replicate_consensus/:
    safe_to_delete: true
  results/qc/:
    safe_to_delete: true
  results/reports/:
    safe_to_delete: true
  results/logs/:
    safe_to_delete: true
  .snakemake/:
    safe_to_delete: conditional
    note: Do not delete while a workflow is running.

final_outputs:
  - results/aligned_data/{sample}.sorted.markdup.filtered.bam
  - results/aligned_data/{sample}.sorted.markdup.filtered.bam.bai
  - results/bigwig/{sample}.sorted.markdup.filtered.CPM.bw
  - results/bigwig_common_scale/{sample}.sorted.markdup.filtered.scaled.bw
  - results/macs3_results/broad/{sample}_peaks.broadPeak
  - results/macs3_results/narrow/{sample}_peaks.narrowPeak
  - results/rnaseh_no_overlap/{sample}_rnaseh_no_overlap.broadPeak
  - results/rnaseh_no_overlap/{sample}_rnaseh_no_overlap.narrowPeak
  - results/rnaseh_signal/{sample}_rnaseh_signal.tsv
  - results/rnaseh_signal/{sample}_rnaseh_depleted.bed
  - results/rnaseh_filtered/{sample}_rnaseh_sensitive.broadPeak
  - results/rnaseh_filtered/{sample}_rnaseh_sensitive.narrowPeak
  - results/replicate_consensus/{group}_consensus.bed
  - results/qc/frip/{sample}.frip.txt
  - results/qc/bigwig_scale/{sample}.bigwig_header.tsv
  - results/qc/rnaseh_sensitivity/{sample}.summary.tsv
  - results/qc/insert_size/{sample}.insert_size_metrics.txt
  - results/reports/multiqc_report.html
