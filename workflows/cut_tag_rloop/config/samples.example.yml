# BioFlowAI CUT&Tag R-loop sample metadata.
#
# Each FASTQ sample is listed once.
# role is one of: treatment, control, rnaseh_control.
# group names biological replicate groups used for consensus peaks and RNaseH statistics.
# control points from a treatment to a MACS3 background control.
# rnaseh_control points from a treatment to the matched RNase H-treated control.

WT_CutTag_RLoop_rep1:
  role: treatment
  group: WT
  control: WT_Input_rep1
  rnaseh_control: WT_RNaseH_rep1
WT_CutTag_RLoop_rep2:
  role: treatment
  group: WT
  control: WT_Input_rep2
  rnaseh_control: WT_RNaseH_rep2
WT_Input_rep1:
  role: control
WT_Input_rep2:
  role: control
WT_RNaseH_rep1:
  role: rnaseh_control
WT_RNaseH_rep2:
  role: rnaseh_control
KO_CutTag_RLoop_rep1:
  role: treatment
  group: KO
  control: KO_Input_rep1
  rnaseh_control: KO_RNaseH_rep1
KO_CutTag_RLoop_rep2:
  role: treatment
  group: KO
  control: KO_Input_rep2
  rnaseh_control: KO_RNaseH_rep2
KO_Input_rep1:
  role: control
KO_Input_rep2:
  role: control
KO_RNaseH_rep1:
  role: rnaseh_control
KO_RNaseH_rep2:
  role: rnaseh_control
