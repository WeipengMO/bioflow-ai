# BioFlowAI CUT&Tag R-loop profiling workflow configuration.
# Copy this file to config/config.yml before running.

assay: CUT&Tag-R-loop
mode: pe  # pe or se
outdir: results
warning_dir: warnings

sample_config: config/samples.yml
raw_data_dir: raw_data

# Optional explicit FASTQ manifest. Leave empty to auto-discover FASTQs from raw_data_dir.
fastq_manifest: ""

# Reference files. Keep all genome resources on the same assembly.
genome: /path/to/human/bowtie2/index/prefix
gsize: hs  # MACS3 genome size. Can be a number (e.g. 2.7e9) or a predefined code.
blacklist: /path/to/ENCODE_blacklist.bed

# Chromosome names removed before duplicate marking. Set [] to disable mitochondrial filtering.
mitochondrial_chromosomes:
  - chrM
  - MT

# Software dependency paths
picard_path: picard

# Core CUT&Tag defaults
peak_type: broad
peak_duplicate_mode: auto  # auto | keep_marked | remove
enable_insert_size_qc: true
enable_multiqc: true

# Scale methods can be multi-selected. Spike-in is preferred when global signal
# changes are biologically meaningful.
scale_methods:
  - CPM
  - spikein

# Generic spike-in normalization. E. coli remains the example/default genome,
# but any spike-in genome can be used if a Bowtie2 index is provided.
spikein:
  enabled: true
  genome: ecoli
  genome_fasta: ""
  bowtie2_index: data/spikein/ecoli_mg1655
  mode: proper_pair_fragments
  allowed_modes:
    - mapped_reads
    - proper_pair_fragments
  min_spikein_reads: 1000
  warn_low_fraction: 0.001

# Shared peak-universe quantification for downstream differential analysis.
count_matrix:
  enabled: true
  peak_universe: consensus  # consensus | union
  min_peak_width: 50
  merge_distance: 100
  min_mapq: 30
  featurecounts_extra: ""

# Tool-specific extra arguments
fastp_extra: ""
fastp_pe_extra: "--detect_adapter_for_pe"
fastp_se_extra: ""
bowtie2_extra: "--very-sensitive"
mark_duplicates_extra: ""
alignment_filter_min_mapq: 30
alignment_filter_view_extra: ""  # auto: PE uses -F 3852, SE uses -F 3844
bam_coverage_extra: "--binSize 10 --normalizeUsing CPM --skipNonCoveredRegions"
spikein_bam_coverage_extra: "--binSize 10 --normalizeUsing None"

# RNaseH-sensitive region thresholds. Ratio mode is exploratory; DESeq2 mode
# uses the shared count matrix and replicate-aware paired statistics.
rnaseh_sensitive:
  enabled: true
  mode: both  # ratio | deseq2 | both
  pseudocount: 0.1
  min_treatment_signal: 0.5
  min_abs_signal_diff: 0.2
  min_fold_change: 2.0
  fdr_threshold: 0.05
  log2fc_threshold: 1.0

# MACS3 defaults are chosen from peak_type and mode.
# broad:  --broad --broad-cutoff 0.1 --keep-dup all -q 0.05
# narrow: --keep-dup all -q 0.01
macs3_extra: ""

# Replicate peak support.
consensus_min_support: 2

# Optional report customization
insert_size_extra: ""
multiqc_extra: ""

# Per-rule threads
threads:
  fastp: 8
  bowtie2: 24
  alignment_filter: 4
  mark_duplicates: 4
  remove_duplicates: 4
  blacklist_filter: 4
  bam_coverage: 8
  bam_coverage_scaled: 8
  normalization: 2
  count_matrix: 4
  bigwig_header_qc: 1
  macs3: 1
  rnaseh_sensitive: 2
  rnaseh_deseq2: 1
  intersect_peaks: 2
  consensus_peaks: 2
  insert_size: 2
  frip: 4
  rloop_qc: 1
  multiqc: 2
