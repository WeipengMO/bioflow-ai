inputs:
  sample_sheet:
    path: config/samples.tsv
    format: tsv
    required_columns:
      sample: Unique sample name.
      fq1: Path to R1 FASTQ or single-end FASTQ.
      fq2: Path to R2 FASTQ. Empty value means single-end sample.
    optional_columns:
      group: Group or condition for differential expression analysis.
      replicate: Replicate ID for distinguishing biological replicates.
  reference:
    genome_gtf: config.genome.gtf
    star_index: config.genome.star_index

final_outputs:
  raw_counts: results/matrix/gene_counts.tsv
  fpkm: results/matrix/gene_fpkm.tsv
  tpm: results/matrix/gene_tpm.tsv
  bigwig_dir: results/bigwig/
  bam_dir: results/bam/
  multiqc: results/report/multiqc_report.html
