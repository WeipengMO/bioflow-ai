workflow:
  name: chipseq
  description: ChIP-seq/CUT&Tag processing workflow from FASTQ to BAM, bigWig, MACS3 peaks, strict intersect peaks, consensus peak universes, read counts, ChIPQC, and HOMER.
  status: development

entrypoint:
  snakefile: Snakefile
  example_config: config/config.example.yml
  sample_config: config/samples.example.yml

commands:
  deploy_project: ./scripts/deploy_pipeline.sh /path/to/chipseq_project
  dry_run: snakemake -np --use-conda
  run: snakemake --use-conda -j 16
  unlock: snakemake --unlock
  generate_fastq_manifest: python scripts/make_fastq_manifest.py --raw-data-dir raw_data --output config/fastq_manifest.tsv

inputs:
  config:
    path: config/config.yml
    required: true
  samples:
    path: config/samples.yml
    required: true
  fastqs:
    path: raw_data/
    required: true
  fastq_manifest:
    path: config/fastq_manifest.tsv
    required: false

outputs:
  aligned_bams:
    path: results/aligned_data/
  tracks:
    path: results/bigwig/
  macs3_peaks:
    path: results/macs3_results/
  intersect_peaks:
    path: results/intersect_peaks/
  consensus_peaks:
    path: results/consensus_peaks/
  chipqc:
    path: results/reports/chipqc/
  homer:
    path: results/reports/homer/
  logs:
    path: results/logs/

safety:
  user_owned:
    - raw_data/
    - config/config.yml
    - config/samples.yml
    - config/fastq_manifest.tsv
    - config/chipqc_sample_sheet.tsv
  safe_to_regenerate:
    - results/clean_data/
    - results/aligned_data/
    - results/bigwig/
    - results/deeptools_profile/
    - results/macs3_results/
    - results/intersect_peaks/
    - results/consensus_peaks/
    - results/reports/
    - results/homer_inputs/
    - results/logs/
    - .snakemake/

notes:
  - Always run a dry-run before changing workflow logic.
  - Do not assume genome build; verify genome, regions_bed, blacklist, and homer_genome are consistent.
  - Prefer fastq_manifest for irregular FASTQ names or multi-lane data that have not been merged.
