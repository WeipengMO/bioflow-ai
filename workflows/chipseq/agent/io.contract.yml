required_config_keys:
  - mode
  - sample_config
  - raw_data_dir
  - genome
  - gsize

optional_config_keys:
  - fastq_manifest
  - regions_bed
  - blacklist
  - call_peak_modes
  - call_peak_types
  - peak_set_mode
  - peak_set_type
  - consensus_min_support_count
  - consensus_min_support_fraction
  - enable_alignment_filter
  - alignment_filter_min_mapq
  - alignment_filter_view_extra
  - enable_blacklist_filter
  - enable_deeptools_profile
  - enable_chipqc
  - enable_homer
  - chipqc_sample_sheet
  - homer_genome

sample_metadata:
  file: config/samples.yml
  schema:
    sample_name:
      role: required one_of[treatment, control]; treatment samples are peak-called, control samples are only used as controls
      group: optional biological replicate group for treatment samples
      control: optional control sample or pooled control name for treatment samples
      pool: optional pooled control name for control samples; controls with the same pool are merged

fastq_manifest:
  file: config/fastq_manifest.tsv
  columns:
    sample: required
    read1: required
    read2: required_for_pe_optional_for_se

generated_outputs:
  bams:
    - results/aligned_data/{sample}.sorted.rmdup.bam
    - results/aligned_data/{sample}.sorted.rmdup.bam.bai
    - results/aligned_data/{sample}.sorted.rmdup.filtered.bam
    - results/aligned_data/{sample}.sorted.rmdup.filtered.bam.bai
  tracks:
    - results/bigwig/{sample}.sorted.rmdup.CPM.bw
  peaks:
    - results/macs3_results/narrow/{sample}_peaks.narrowPeak
    - results/macs3_results/broad/{sample}_peaks.broadPeak
    - results/macs3_results/narrow_no_control/{sample}_peaks.narrowPeak
    - results/macs3_results/broad_no_control/{sample}_peaks.broadPeak
  intersect_peaks:
    - results/intersect_peaks/{group}_intersect_peaks.bed
  consensus_peaks:
    - results/consensus_peaks/groups/{group}_consensus_peaks.bed
    - results/consensus_peaks/groups/{group}_consensus_peaks.tsv
    - results/consensus_peaks/groups/{group}_consensus_support_matrix.tsv
    - results/consensus_peaks/groups/{group}_consensus_peaks.saf
    - results/consensus_peaks/all_treatments_consensus_peaks.bed
    - results/consensus_peaks/all_treatments_consensus_peaks.tsv
    - results/consensus_peaks/all_treatments_consensus_support_matrix.tsv
    - results/consensus_peaks/all_treatments_consensus_peaks.saf
    - results/consensus_peaks/counts/all_treatments_counts.tsv
  reports:
    - results/reports/chipqc/
    - results/reports/homer/
  logs:
    - results/logs/
