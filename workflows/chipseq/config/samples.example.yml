# Treatment samples to call peaks on.
# Sample names must match FASTQ names after removing the read suffix, or the sample column in fastq_manifest.tsv.
treatments:
  - WT_H3K27ac_rep1
  - WT_H3K27ac_rep2
  - KO_H3K27ac_rep1
  - KO_H3K27ac_rep2

# Control strategy:
#   none    - call peaks without control only
#   matched - each treatment has one matched control in controls.matched
#   pooled  - merge one or more control groups and assign each treatment to one pooled control
controls:
  strategy: pooled

  pooled:
    WT_input_pool:
      treatments:
        - WT_H3K27ac_rep1
        - WT_H3K27ac_rep2
      controls:
        - WT_Input_rep1
        - WT_Input_rep2

    KO_input_pool:
      treatments:
        - KO_H3K27ac_rep1
        - KO_H3K27ac_rep2
      controls:
        - KO_Input_rep1
        - KO_Input_rep2

  matched: {}
