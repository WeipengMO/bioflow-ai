# BioFlowAI ChIP-seq/CUT&Tag workflow configuration.
# Copy this file to config/config.yml before running.

mode: pe  # pe or se
outdir: results

sample_config: config/samples.yml
raw_data_dir: raw_data

# Optional explicit FASTQ manifest. Leave empty to auto-discover FASTQs from raw_data_dir.
# Recommended for irregular file names or multiple lanes that were not merged before analysis.
fastq_manifest: ""

# Reference files
genome: /path/to/bowtie2/index/prefix
regions_bed: /path/to/regions.bed
gtf: /path/to/annotations.gtf
gsize: hs  # Genome size for MACS3. Can be a number (e.g. 2.7e9) or a predefined code (hs, mm, etc.)

# software dependency paths
picard_path: /path/to/picard.jar

# Core switches
enable_alignment_filter: true
enable_blacklist_filter: true
enable_deeptools_profile: true
enable_chipqc: false
enable_homer: false

# Peak calling
call_peak_modes:
  - with_control
  # - without_control
call_peak_types:
  - narrow
  # - broad
macs3_broad_cutoff: 0.1
# Extra arguments appended directly to macs3 callpeak. Leave empty for defaults.
macs3_extra: ""

# Peak set used by intersect_peaks and consensus_peaks.
peak_set_mode: with_control
peak_set_type: narrow

# Consensus peak universe.
# Defaults keep every union peak; increase one threshold for stricter support.
consensus_min_support_count: 1
consensus_min_support_fraction: 0.0

# ChIPQC
# If chipqc_sample_sheet is empty and enable_chipqc is true, a generic sheet is generated automatically.
chipqc_sample_sheet: ""
chipqc_peak_mode: with_control
chipqc_peak_type: narrow

# HOMER motif enrichment
homer_input_source: intersect_peaks   # intersect_peaks or sample_peaks
homer_peak_mode: with_control
homer_peak_type: narrow
homer_genome: hg38
homer_size: 200
homer_extra: "-mask -len 8,10,12"
homer_use_summit: true
blacklist: "/data/user/mowp/db/hg38/bed/hg38-blacklist.v2.bed"

# Tool-specific extra arguments
fastp_extra: ""
bowtie2_extra: "--dovetail --very-sensitive -X 1000"
alignment_filter_min_mapq: 30
alignment_filter_view_extra: ""  # auto: PE uses -f 2 -F 1804, SE uses -F 1796
mark_duplicates_extra: "REMOVE_DUPLICATES=true"
bam_coverage_extra: "--binSize 10 --normalizeUsing CPM --skipNonCoveredRegions"
compute_matrix_extra: "scale-regions -b 1000 -a 1000 --skipZeros"
plot_profile_extra: ""

# Per-rule threads
threads:
  fastp: 8
  bowtie2: 24
  alignment_filter: 4
  mark_duplicates: 4
  blacklist_filter: 4
  merge_control: 4
  bam_coverage: 8
  compute_matrix: 8
  macs3: 1
  chipqc: 8
  homer: 24
